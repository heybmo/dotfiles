- defaults:
    link:
      relink: true

- link:
    ~/.config/kitty: kitty
    ~/.config/nvim: nvim
    ~/.zshrc: .zshrc
    ~/.tools_list: tools_list
    ~/notebook: notebook
    ~/.tmux.conf: .tmux.conf
    ~/.config/scripts: scripts
    ~/.config/starship.toml: starship.toml
    ~/.ideavimrc: .ideavimrc
    ~/.config/ghostty: ghostty
    ~/.leetcode: .leetcode
    ~/.claude/:
      glob: true
      path: .claude/*
      create: true

- shell:
  - [git submodule update --init --recursive, Installing submodules]
