- defaults:
    link:
      relink: true

- link:
    ~/.config/kitty: kitty
    ~/.config/nvim: nvim
    ~/.config/zed: zed
    ~/.config/htop: htop
    ~/.config/tmux: tmux
    ~/.zshrc: .zshrc
    ~/.tools_list: tools_list.txt
    ~/notebook: notebook
    ~/.tmux.conf: .tmux.conf
    ~/.config/scripts: scripts
    ~/.config/starship.toml: starship.toml
    ~/.ideavimrc: .ideavimrc
    ~/.config/ghostty: ghostty
    ~/.config/opencode/:
      glob: true
      path: opencode/*
      create: true
    ~/.claude/:
      glob: true
      path: .claude/*
      create: true

- shell:
  - [git submodule update --init --recursive, Installing submodules]
